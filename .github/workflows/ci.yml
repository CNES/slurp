name: CI Pipeline

on:
  push:
    branches:
      - main
    pull_request:
      branches:
        - '**'

jobs:
  build-env:
    name: Build Environment
    runs-on: ubuntu-latest
    steps:
      - run: echo "------ Building environment ... ------"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OTB
        run: |
          mkdir -p $HOME/Downloads
          curl -L https://www.orfeo-toolbox.org/packages/archives/OTB/OTB-9.0.0-Linux.tar.gz -o $HOME/Downloads/OTB-9.0.0-Linux.tar.gz

      - name: Extract OTB
        run: |
          mkdir -p $HOME/OTB_install
          tar xf $HOME/Downloads/OTB-9.0.0-Linux.tar.gz --one-top-level=$HOME/OTB_install

      - name: Source OTB Environment
        run: |
          source $HOME/OTB_install/OTB-9.0.0-Linux/otbenv.profile
        shell: bash

      - name: Install Eoscale
        run: |
          git clone https://github.com/CNES/eoscale.git
          cd eoscale
          pip install .

      - run: echo "------ Environment builded ! ------"


  formater:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - run: echo "------ passing formaters ... ------"

      - name: Checkout repository
        uses: actions/checkout@4

      - name: Install Dependencies
        shell: bash -l {0}
        run: pip install -e .[dev]

      - name: Run Black & Isort
        run: |
          black --check --diff slurp tests
          isort slurp tests --check --diff
      
      - run: echo "------ formaters done ! ------"

  # pytest:
  #   name: Run Pytest
  #   runs-on: ubuntu-latest
  #   needs: build-env
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4

  #     - name: Run Pytest with coverage
  #       shell: bash -l {0}
  #       run: |
  #         pip install -e .[dev]
  #         pytest -s tests --cov=slurp --cov-report=xml:.ci-reports/coverage.xml --cov-report html:cov_html --cov-report=term --junitxml=pytest-results.xml

  #       - name 

    pylint_analysis:
      name: Pylint code analysis
      runs-on: ubuntu-latest
      needs: build-env
      steps:
        - run: echo "------ Starting Pylint Analysis ... ------"

        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install dependencies
          shell: bash -l {0}
          run: pip install -e .[dev]

        - name: Run Pylint
          shell: bash -l {0}
          run: |
            pylint --score=yes --fail-under=10 slurp 

        - run: echo "------ Pylint Analysis done ! ------"