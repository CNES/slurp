name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-env:
    name: Run CI
    runs-on: ubuntu-latest
    steps:
      - run: echo "------ Building environment ... ------"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install numpy
        run: |
          sudo apt-get install -y python3-numpy

      - name: Install Eoscale
        run: pip install eoscale

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: pip install -e .[dev]

      - run: echo "------ Environment builded ! ------"
      
      - run: echo "------ passing formaters ... ------"

      - name: Run Black & Isort
        run: |
          black --check --diff slurp tests
          isort slurp tests --check --diff
        continue-on-error: true
      
      - run: echo "------ formaters done ! ------"

      - run: echo "------ Starting Pylint Analysis ... ------"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: pip install -e .[dev]

      - name: Run Pylint
        shell: bash
        run: |
          pylint --score=yes --fail-under=9 slurp 

      - run: echo "------ Pylint Analysis done ! ------"

      - run: echo "------ Starting CI tests ... -------"

      - name: Run CI tests
        shell: bash
        run: pytest -m fast --cov=slurp
